name: hw02-quakes

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  WH_HOST: warehouse
  WH_PORT: "5432"
  WH_DB: ${WAREHOUSE_DB}
  WH_USER: ${WAREHOUSE_USER}
  WH_PASSWORD: ${WAREHOUSE_PASSWORD}
  DBT_PROFILES_DIR: /opt/project/dbt
  DBT_TARGET_PATH: /tmp/dbt_target
  DBT_LOG_PATH: /tmp/dbt_logs

x-airflow-volumes: &airflow-volumes
  - ./airflow/dags:/opt/airflow/dags:ro
  - ./loader:/opt/project/loader:ro
  - ./dbt:/opt/project/dbt:ro
  - ./sql:/opt/project/sql:ro
  - ./data:/opt/project/data:ro
  - airflow_logs:/opt/airflow/logs

services:
  warehouse:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB}
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER} -d ${WAREHOUSE_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  airflow-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 12

  airflow-init:
    build: .
    image: hw02-airflow:2.11.2
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    volumes: *airflow-volumes
    depends_on:
      airflow-db:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        airflow users create --username "$$AIRFLOW_ADMIN_USER" --password "$$AIRFLOW_ADMIN_PASSWORD"
        --firstname admin --lastname admin --role Admin --email admin@example.com || true

  airflow-webserver:
    image: hw02-airflow:2.11.2
    command: webserver
    environment: *airflow-env
    volumes: *airflow-volumes
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      warehouse:
        condition: service_healthy

  airflow-scheduler:
    image: hw02-airflow:2.11.2
    command: scheduler
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      warehouse:
        condition: service_healthy

volumes:
  warehouse_data:
  airflow_db_data:
  airflow_logs:
