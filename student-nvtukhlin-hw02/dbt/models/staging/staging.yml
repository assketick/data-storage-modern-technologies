version: 2

models:
  - name: stg_event_versions
    columns:
      - name: event_id
        data_tests:
          - not_null
      - name: event_ts
        data_tests:
          - not_null
  - name: stg_events_latest
    columns:
      - name: event_key
        data_tests:
          - not_null
          - unique
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["reviewed", "automatic"]
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["earthquake", "mining explosion"]
  - name: stg_network_history
    columns:
      - name: net
        data_tests:
          - not_null
